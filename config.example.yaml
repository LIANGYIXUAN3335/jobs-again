db_path: data/jobscan.db
user_db_path: data/user_state.db
company_notes: company_notes.yaml

ui:
  page_size: 80
  default_status: new

http:
  host: 127.0.0.1
  port: 8787
  reload: false

weights:
  tech: 0.35
  product: 0.25
  company: 0.2
  logistics: 0.2

verdict_thresholds:
  strong: 70
  consider: 60

signature_match: warn
