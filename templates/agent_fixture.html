<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Northstar Labs · Practice application</title>
<style>body{font:14px/1.5 system-ui;color:#233b3a;background:#fff;margin:0;padding:28px}header{border-bottom:1px solid #e6ebe8;padding-bottom:16px}h1{font-size:22px;margin:4px 0}p{color:#6b7b77}form{padding-top:16px}label{display:block;font-weight:550;margin:0 0 5px}input,select,textarea{box-sizing:border-box;width:100%;padding:9px 10px;border:1px solid #d8e0dc;border-radius:7px;background:#fff;font:inherit;color:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:16px}textarea{height:90px}small{font-size:11px;color:#87928b}#jobscan-panel{visibility:hidden!important}button{border:0;border-radius:6px;padding:10px 18px;background:#e5eae7;color:#74827c}input:focus,select:focus,textarea:focus{outline:2px solid #94b8aa}</style>
</head><body>
<header><small>FICTIONAL COMPANY · LOCAL PRACTICE</small><h1>Northstar Labs</h1><p>Backend Engineer · Application form</p></header>
<form id="application" onsubmit="return false">
<div class="row"><div class="field"><label for="first_name">First name</label><input id="first_name" name="first_name" required></div><div class="field"><label for="last_name">Last name</label><input id="last_name" name="last_name" required></div></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
<div class="field"><label for="auth">Are you authorized to work in the United States?</label><select id="auth" required><option value="">Select an option</option><option>Yes</option><option>No</option></select></div>
<div class="field"><label for="sponsor">Will you now or in the future require sponsorship?</label><select id="sponsor" required><option value="">Select an option</option><option>Yes</option><option>No</option></select></div>
<div class="field"><label for="degree">Highest degree</label><select id="degree" required><option value="">Select an option</option><option>Master of Science in Computer Science</option><option>MBA</option><option>Bachelor's degree</option></select></div>
<div class="field"><label for="why">Why are you interested in this role?</label><textarea id="why" required></textarea></div>
<div id="form-error" role="alert" hidden></div>
<button type="submit" id="practice-submit">Submit Application</button>
</form>
<div data-application-success hidden><h2>Success</h2>Your application was submitted successfully.（仅本机练习回执）</div>
<script src="/agent-lab/assets/form-agent.js"></script><script src="/agent-lab/assets/fixture.js"></script><script src="/agent-lab/assets/content.js"></script>
</body></html>
